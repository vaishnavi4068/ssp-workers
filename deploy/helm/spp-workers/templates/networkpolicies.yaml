---
# Isolate spp-platform workers and runner Jobs from spp-factory (ADR-CLD-GCP-001 REQ-4)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spp-workers-networkpolicy
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - spp-workers
          - spp-tf-runner
          - spp-drift-scanner
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spp-temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace }}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8181
        - protocol: TCP
          port: 5432
    # GKE metadata server for Workload Identity tokens (169.254.169.254:80 and Dataplane V2 169.254.169.252:988)
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
