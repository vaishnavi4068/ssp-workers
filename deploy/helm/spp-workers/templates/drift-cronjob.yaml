{{- if .Values.drift.enabled }}
{{- range $projectId := .Values.drift.projects }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: "drift-{{ $projectId }}"
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: spp-drift-scanner
    app.kubernetes.io/part-of: spp-platform
    spp.platform/project-id: {{ $projectId | quote }}
spec:
  schedule: {{ $.Values.drift.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $.Values.terraform.jobActiveDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: spp-drift-scanner
            app.kubernetes.io/part-of: spp-platform
            spp.platform/project-id: {{ $projectId | quote }}
        spec:
          serviceAccountName: {{ $.Values.serviceAccounts.runner.name }}
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            {{- toYaml $.Values.global.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml $.Values.global.tolerations | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: drift-scanner
              image: "{{ $.Values.images.registry }}/{{ $.Values.images.repo }}:{{ $.Values.images.tag }}"
              imagePullPolicy: {{ $.Values.images.pullPolicy }}
              command:
                - "python"
                - "-m"
                - "workers.drift"
                - "--project-id"
                - {{ $projectId | quote }}
              env:
                - name: SPP_PROJECT_ID
                  value: {{ $projectId | quote }}
                - name: SPP_STATE_BUCKET
                  value: {{ $.Values.terraform.stateBucket | quote }}
                - name: GOOGLE_CLOUD_PROJECT
                  value: {{ $.Values.global.gcpProjectId | quote }}
                - name: GOOGLE_CLOUD_LOCATION
                  value: {{ $.Values.global.gcpRegion | quote }}
                - name: SPP_RUNNER_KSA
                  value: {{ $.Values.serviceAccounts.runner.name | quote }}
                - name: SPP_RUNNER_GSA
                  value: {{ $.Values.serviceAccounts.runner.gsaEmail | quote }}
                - name: SPP_RUNNER_IMAGE_TAG
                  value: {{ $.Values.images.runnerTag | default $.Values.images.tag | quote }}
                - name: SPP_RUNNER_IMAGE
                  value: "{{ $.Values.images.registry }}/{{ $.Values.images.runnerRepo }}:{{ $.Values.images.runnerTag | default $.Values.images.tag }}"
                - name: SPP_DEFAULT_KMS_KEY_NAME
                  value: {{ $.Values.terraform.defaultKmsKeyName | quote }}
                - name: SPP_ALLOYDB_HOST
                  value: {{ $.Values.alloydb.host | quote }}
                - name: SPP_ALLOYDB_PORT
                  value: {{ $.Values.alloydb.port | quote }}
                - name: SPP_ALLOYDB_DB
                  value: {{ $.Values.alloydb.database | quote }}
                - name: SPP_ALLOYDB_USER
                  value: {{ $.Values.alloydb.username | quote }}
                - name: SPP_ALLOYDB_PASSWORD_SECRET
                  value: {{ $.Values.alloydb.gcpSecretManagerPasswordSecret | quote }}
                - name: SPP_ALLOYDB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.alloydb.k8sSecretName | quote }}
                      key: {{ $.Values.alloydb.k8sSecretKey | quote }}
                      optional: true
                {{- $useGcs := true -}}
                {{- if and (hasKey $.Values "worker") (hasKey $.Values.worker "useGcs") -}}
                  {{- $useGcs = $.Values.worker.useGcs -}}
                {{- else if and (hasKey $.Values "modes") (hasKey $.Values.modes "useGcs") -}}
                  {{- $useGcs = $.Values.modes.useGcs -}}
                {{- end -}}
                {{- $useDb := true -}}
                {{- if and (hasKey $.Values "worker") (hasKey $.Values.worker "useDb") -}}
                  {{- $useDb = $.Values.worker.useDb -}}
                {{- else if and (hasKey $.Values "modes") (hasKey $.Values.modes "useDb") -}}
                  {{- $useDb = $.Values.modes.useDb -}}
                {{- end }}
                - name: SPP_WORKER_USE_GCS
                  value: {{ $useGcs | toString | quote }}
                - name: SPP_WORKER_USE_DB
                  value: {{ $useDb | toString | quote }}
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
{{- end }}
{{- end }}
