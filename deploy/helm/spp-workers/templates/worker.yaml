---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spp-workers
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: spp-workers
    app.kubernetes.io/part-of: spp-platform
spec:
  replicas: {{ if and (hasKey .Values "replicas") (hasKey .Values.replicas "worker") }}{{ .Values.replicas.worker }}{{ else if hasKey .Values "replicaCount" }}{{ .Values.replicaCount }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: spp-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spp-workers
        app.kubernetes.io/part-of: spp-platform
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.worker.name }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: spp-workers
          image: "{{ .Values.images.registry }}/{{ .Values.images.repo }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
            - name: SPP_K8S_NAMESPACE
              value: {{ .Values.global.namespace | quote }}
            - name: SPP_RUNNER_KSA
              value: {{ .Values.serviceAccounts.runner.name | quote }}
            - name: SPP_RUNNER_GSA
              value: {{ .Values.serviceAccounts.runner.gsaEmail | quote }}
            - name: SPP_IMAGE_REGISTRY
              value: {{ .Values.images.registry | quote }}
            - name: SPP_RUNNER_IMAGE_REPO
              value: {{ .Values.images.runnerRepo | quote }}
            - name: SPP_RUNNER_IMAGE_TAG
              value: {{ .Values.images.runnerTag | default .Values.images.tag | quote }}
            - name: SPP_RUNNER_IMAGE
              value: "{{ .Values.images.registry }}/{{ .Values.images.runnerRepo }}:{{ .Values.images.runnerTag | default .Values.images.tag }}"
            - name: SPP_STATE_BUCKET
              value: {{ .Values.terraform.stateBucket | quote }}
            - name: SPP_DEFAULT_KMS_KEY_NAME
              value: {{ .Values.terraform.defaultKmsKeyName | quote }}
            - name: SPP_ALLOYDB_HOST
              value: {{ .Values.alloydb.host | quote }}
            - name: SPP_ALLOYDB_PORT
              value: {{ .Values.alloydb.port | quote }}
            - name: SPP_ALLOYDB_DB
              value: {{ .Values.alloydb.database | quote }}
            - name: SPP_ALLOYDB_USER
              value: {{ .Values.alloydb.username | quote }}
            - name: SPP_ALLOYDB_PASSWORD_SECRET
              value: {{ .Values.alloydb.gcpSecretManagerPasswordSecret | quote }}
            - name: SPP_ALLOYDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alloydb.k8sSecretName | quote }}
                  key: {{ .Values.alloydb.k8sSecretKey | quote }}
                  optional: true
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.global.gcpProjectId | quote }}
            - name: GOOGLE_CLOUD_LOCATION
              value: {{ .Values.global.gcpRegion | quote }}
            {{- $useK8s := true -}}
            {{- if and (hasKey .Values "worker") (hasKey .Values.worker "useK8s") -}}
              {{- $useK8s = .Values.worker.useK8s -}}
            {{- else if and (hasKey .Values "modes") (hasKey .Values.modes "useK8s") -}}
              {{- $useK8s = .Values.modes.useK8s -}}
            {{- end -}}
            {{- $useGcs := true -}}
            {{- if and (hasKey .Values "worker") (hasKey .Values.worker "useGcs") -}}
              {{- $useGcs = .Values.worker.useGcs -}}
            {{- else if and (hasKey .Values "modes") (hasKey .Values.modes "useGcs") -}}
              {{- $useGcs = .Values.modes.useGcs -}}
            {{- end -}}
            {{- $useDb := true -}}
            {{- if and (hasKey .Values "worker") (hasKey .Values.worker "useDb") -}}
              {{- $useDb = .Values.worker.useDb -}}
            {{- else if and (hasKey .Values "modes") (hasKey .Values.modes "useDb") -}}
              {{- $useDb = .Values.modes.useDb -}}
            {{- end }}
            - name: SPP_WORKER_USE_K8S
              value: {{ $useK8s | toString | quote }}
            - name: SPP_WORKER_USE_GCS
              value: {{ $useGcs | toString | quote }}
            - name: SPP_WORKER_USE_DB
              value: {{ $useDb | toString | quote }}
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
